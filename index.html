<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="おさいふ">
  <title>おさいふ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="prevMonth" aria-label="前の月">‹</button>
    <h1 id="title" class="title"></h1>
    <button class="icon-btn" id="nextMonth" aria-label="次の月">›</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="メニュー">
    <button data-tab="home" class="tab"><span class="tab-ic">🏠</span><span>ホーム</span></button>
    <button data-tab="cal" class="tab"><span class="tab-ic">📅</span><span>カレンダー</span></button>
    <button id="fab" class="fab" aria-label="記録する">＋</button>
    <button data-tab="list" class="tab"><span class="tab-ic">🧾</span><span>履歴</span></button>
    <button data-tab="wallet" class="tab"><span class="tab-ic">👛</span><span>財布</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
