name: Sync merge model
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  merge-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/sync-merge.test.mjs
